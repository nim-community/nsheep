name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: '2.2.8'

      - name: Build frontend
        run: |
          nimble install karax -y
          nim js -d:release -o:public/app.js frontend/app.nim
          cp frontend/index.html public/
          cp frontend/app.css public/
          cp frontend/robot.svg public/
          cp frontend/theme.js public/
          perl -pi -e 's/\?v=GIT_HASH/?v='$(git rev-parse --short HEAD)'/g' public/index.html

      - name: Verify SSH secrets exist
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then echo "SSH_HOST is empty"; exit 1; fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then echo "SSH_USER is empty"; exit 1; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then echo "SSH_PRIVATE_KEY is empty"; exit 1; fi
          echo "All SSH secrets are set"

      - name: Upload static files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "public/*"
          target: "/opt/nsheep/public/"
          strip_components: 1

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 3m
          script: |
            cd /opt/nsheep
            git pull
            sudo rc-service nsheep stop
            sudo rc-service nsheep-fetcher stop
            nimble build -d:release -d:strip --passC:-march=x86-64
            sudo chown nsheep:nsheep /opt/nsheep/nsheep
            sudo chown nsheep:nsheep /opt/nsheep/nsheep-fetcher
            sudo rc-service nsheep start
            sudo rc-service nsheep-fetcher start
            sleep 2
            sudo rc-service nsheep status || exit 1
            sudo rc-service nsheep-fetcher status || exit 1
